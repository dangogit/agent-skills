name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill
        run: |
          python - <<'PY'
          import pathlib
          paths = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          assert paths
          for path in paths:
              text = path.read_text(encoding="utf-8")
              header = text.split("---", 2)[1]
              assert f"\nname: {path.parent.name}\n" in f"\n{header}"
              assert "description:" in header
              assert "TODO" not in text
          PY
      - name: Compile
        run: python -m compileall -q skills
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s skills/hebrew-keyboard-mistype/tests -v
